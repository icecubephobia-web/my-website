
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cole's Proxy</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 35px;
  border-bottom: 1px solid #202333;
  font-size: 20px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: 65px auto;
  padding: 20px;
}

h1 {
  font-size: 36px;
  text-align: center;
}

p {
  color: #9299aa;
  text-align: center;
}

.browser {
  margin-top: 35px;
  padding: 15px;
  background: #151927;
  border: 1px solid #292f42;
  border-radius: 14px;
}

.address {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  background: #090b12;
  border: 1px solid #30384d;
  border-radius: 8px;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #657cff;
}

button {
  padding: 0 22px;
  background: #536dfe;
  border: 0;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #4059e8;
}

iframe {
  width: 100%;
  height: 550px;
  background: white;
  border: 0;
  border-radius: 8px;
}

footer {
  text-align: center;
  color: #606a80;
  padding: 25px;
}
</style>
</head>

<body>

<header>◈ Web Portal</header>

<main>
<h1>Your Web Portal</h1>
<p>A simple browser-style web experience.</p>

<div class="browser">

  <form class="address" id="searchForm">
    <input
      id="searchInput"
      type="text"
      placeholder="Search DuckDuckGo..."
      autocomplete="off"
      required
    >
    <button type="submit">Search</button>
  </form>

  <iframe
    id="browserFrame"
    src="https://example.com"
    title="Webpage">
  </iframe>

</div>
</main>

<footer>Powered by Cloudflare</footer>

<script>
document.getElementById("searchForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const query = document.getElementById("searchInput").value.trim();

  if (!query) return;

  const url = "https://duckduckgo.com/?q=" + encodeURIComponent(query);

  document.getElementById("browserFrame").src = url;
});
</script>

</body>
</html>
