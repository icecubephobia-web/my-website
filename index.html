
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cole's Proxy</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 35px;
  border-bottom: 1px solid #202333;
  font-size: 20px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: 45px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 34px;
}

p {
  color: #9299aa;
  text-align: center;
}

.browser {
  margin-top: 30px;
  padding: 15px;
  background: #151927;
  border: 1px solid #292f42;
  border-radius: 14px;
}

.address {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #090b12;
  border: 1px solid #30384d;
  border-radius: 8px;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #657cff;
}

button {
  padding: 0 25px;
  background: #536dfe;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #4059e8;
}

iframe {
  width: 100%;
  height: 650px;
  background: white;
  border: none;
  border-radius: 8px;
}

footer {
  text-align: center;
  color: #606a80;
  padding: 25px;
}
</style>
</head>

<body>

<header>◈ Cole's Proxy</header>

<main>
<h1>Web Browser</h1>
<p>Enter a website address to get started.</p>

<div class="browser">

  <form class="address" id="addressForm">
    <input
      id="addressInput"
      type="text"
      placeholder="Enter website address..."
      autocomplete="url"
      required
    >

    <button type="submit">Go</button>
  </form>

  <iframe
    id="browserFrame"
    src="about:blank"
    title="Browser window">
  </iframe>

</div>
</main>

<footer>Powered by Cloudflare</footer>

<script>
const form = document.getElementById("addressForm");
const input = document.getElementById("addressInput");
const frame = document.getElementById("browserFrame");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  let address = input.value.trim();

  if (!address) return;

  if (!/^https?:\/\//i.test(address)) {
    address = "https://" + address;
  }

  try {
    const url = new URL(address);

    if (!url.hostname.includes(".")) {
      alert("Please enter a valid website address.");
      return;
    }

    frame.src = url.href;
    input.value = url.href;

  } catch {
    alert("Invalid website address.");
  }
});
</script>

</body>
</html>
