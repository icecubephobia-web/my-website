<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cole's Proxy</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 35px;
  border-bottom: 1px solid #202333;
  font-size: 20px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: 65px auto;
  padding: 20px;
}

h1 {
  font-size: 36px;
  text-align: center;
}

p {
  color: #9299aa;
  text-align: center;
}

.browser {
  margin-top: 35px;
  padding: 15px;
  background: #151927;
  border: 1px solid #292f42;
  border-radius: 14px;
}

.address {
  padding: 13px;
  background: #090b12;
  border: 1px solid #30384d;
  border-radius: 8px;
  color: #aab3c9;
  margin-bottom: 14px;
}

iframe {
  width: 100%;
  height: 550px;
  background: white;
  border: 0;
  border-radius: 8px;
}

footer {
  text-align: center;
  color: #606a80;
  padding: 25px;
}
</style>
</head>
<body>

<header>◈ Web Portal</header>

<main>
<h1>Your Web Portal</h1>
<p>A simple browser-style web experience.</p>

<div class="browser">
  <div class="address">
    https://example.com
  </div>

  <iframe
    src="https://round-heart-005b.crpytkid.workers.dev"
    title="Demo webpage">
  </iframe>
</div>
</main>

<footer>Powered by Cloudflare</footer>

</body>
</html>
