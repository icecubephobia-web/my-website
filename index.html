<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexium JEW Traders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --surface:#ffffff; --ink:#14181f; --muted:#5b6573; --line:#d3d9e0;
  --accent:#f2b01e; --accent-ink:#14181f; --loss:#c8372d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181f; --surface:#1e242e; --ink:#eef1f4; --muted:#9aa5b4; --line:#2e3744;
    --accent:#f2b01e; --accent-ink:#14181f; --loss:#ff6a5e;
  }
}
:root[data-theme="dark"]{
  --bg:#14181f; --surface:#1e242e; --ink:#eef1f4; --muted:#9aa5b4; --line:#2e3744;
  --accent:#f2b01e; --accent-ink:#14181f; --loss:#ff6a5e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{border-bottom:4px solid var(--accent);padding:48px 20px 32px;max-width:960px;margin:0 auto}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,8vw,4.5rem);line-height:1;margin:0 0 12px;letter-spacing:-.02em}
h1 .bad{color:var(--loss)}
.sub{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:clamp(1.05rem,3vw,1.4rem);margin:0}
main{max-width:960px;margin:0 auto;padding:28px 20px 64px}
.add{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:6px;padding:20px;display:grid;gap:12px}
.add h2{margin:0;font-size:1.1rem}
label{font-weight:600;font-size:.9rem}
input[type=file],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:4px;padding:11px 18px;background:var(--accent);color:var(--accent-ink)}
button:hover{filter:brightness(.95)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.preview{max-width:220px;border-radius:4px;display:none}
.msg{color:var(--loss);font-size:.9rem;min-height:1.2em;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:28px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.post img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.post div{padding:14px 16px;display:grid;gap:8px;flex:1;align-content:start}
.post h2{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.3rem}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post button{background:transparent;color:var(--muted);padding:0;justify-self:start;font-weight:600;font-size:.85rem}
.post button:hover{color:var(--loss)}
.empty{color:var(--muted);margin-top:28px}
</style>
</head>
